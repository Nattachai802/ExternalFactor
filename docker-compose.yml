# รัน: docker compose up -d
# ทั้ง 2 service อยู่ network เดียวกันอัตโนมัติ (compose สร้างให้) — api เรียก db ผ่าน
# ชื่อ service "db" ได้เลย ไม่ต้องพึ่ง localhost/host.docker.internal ที่พังบน Linux/EC2
#
# ⚠️ ก่อนรัน ต้องแก้ .env: DATABASE_URL=postgresql://postgres:postgres@db:5432/exfactor
#    (เปลี่ยน localhost → db — ชื่อต้องตรงกับ service ด้านล่าง)

# จำกัดขนาด log — Docker driver json-file ไม่ลบไฟล์เก่าเองเลยถ้าไม่ตั้ง
# uvicorn log ทุก request (~100 bytes) วันละหลายพันครั้ง = โตไม่มีวันหยุด
# disk เต็มเมื่อไหร่ Postgres เขียนไม่ได้ = ล่มทั้งระบบ และแก้ยากเพราะไม่เหลือที่ให้ทำอะไร
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"    # ไฟล์ละ 10MB
    max-file: "3"      # เก็บ 3 ไฟล์ = สูงสุด 30MB ต่อ service แล้วหมุนทับ

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exfactor
    volumes:
      - pgdata:/var/lib/postgresql/data   # ข้อมูลอยู่รอด แม้ container ถูกลบ/สร้างใหม่
    ports:
      - "5432:5432"   # เปิดออก host ไว้เผื่อต้องต่อด้วย psql/GUI จากนอก container — ปิดได้ถ้าไม่ใช้
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   # รอ Postgres พร้อมรับ connection ก่อน แทนการเดา sleep

volumes:
  pgdata:
